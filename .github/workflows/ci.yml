name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Dependencies
        run: brew install libusb pkg-config
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Build the app
        run: scripts/build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Tetherly
          path: dist/*.zip
