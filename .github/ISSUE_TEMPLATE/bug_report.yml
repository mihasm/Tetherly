name: Bug report
description: Tethering does not connect, drops, or breaks something
body:
  - type: input
    attributes:
      label: Phone (model, Android version)
    validations:
      required: true
  - type: input
    attributes:
      label: Mac (model, macOS version)
    validations:
      required: true
  - type: textarea
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    attributes:
      label: Output of `tetherly devices` and `tetherly status`
      render: text
  - type: textarea
    attributes:
      label: Log (menu bar > Log > Copy, or /Library/Logs/Tetherly/tetherly.log)
      render: text
